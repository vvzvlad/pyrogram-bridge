name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install libmagic (python-magic system dependency)
      run: sudo apt-get update && sudo apt-get install -y libmagic1

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest --tb=short -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to the Gitea container registry
      uses: docker/login-action@v2
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # Org-level secret on `projects`; the built-in GITEA_TOKEN has no
        # package scope and cannot push images.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag gitea.vvzvlad.xyz/${{ github.repository }}:latest --tag gitea.vvzvlad.xyz/${{ github.repository }}:${{ github.sha }}
      
    - name: Push Docker images
      run: |
        docker push gitea.vvzvlad.xyz/${{ github.repository }}:latest
        docker push gitea.vvzvlad.xyz/${{ github.repository }}:${{ github.sha }}
